services:
  container-agent-ui:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: container-agent-ui:latest
    container_name: container-agent-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ${CONTAINER_AGENT_DATA_DIR:-${HOME}/.local/share/container-agent}:/data:rw,Z
    environment:
      CONTAINER_AGENT_DATA_DIR: /data
