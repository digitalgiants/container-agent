services:
  container-agent-ui:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: container-agent-ui:latest
    container_name: container-agent-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ${CONTAINER_AGENT_DATA_DIR:-${HOME}/.local/share/container-agent}:/data:rw,Z
    environment:
      CONTAINER_AGENT_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
