services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: container-agent-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  container-agent-ui:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: container-agent-ui:latest
    container_name: container-agent-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    volumes:
      # :z (shared) lets the host agent and container both read/write (required on SELinux/RHEL).
      - ${CONTAINER_AGENT_DATA_DIR}:/data:rw,z
      - ${CONTAINER_AGENT_CONFIG_DIR}:/config:ro,z
    environment:
      CONTAINER_AGENT_DATA_DIR: /data
      CONTAINER_AGENT_CONFIG_DIR: /config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ollama-data:
